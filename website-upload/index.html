<script>
// Live calculator
var tcp = {
  rate: 129.35, // effective HTG per USD
  set: function(amount) {
    var fee = +(amount * 0.02).toFixed(2);
    var htg = Math.round((amount - fee) * this.rate);
    var diff = Math.round(htg - amount * 0.92 * 125); // vs WU
    document.getElementById('ov-send').textContent = '$' + amount.toFixed(2);
    document.getElementById('ov-fee').textContent  = '$' + fee.toFixed(2);
    document.getElementById('ov-htg').textContent  = htg.toLocaleString() + ' HTG';
    document.getElementById('ov-info').textContent =
      'Send $' + amount + ' via TchotchoPay and your family gets ' +
      (diff > 0 ? diff.toLocaleString() : '0') + ' HTG more than Western Union.';
    var cta = document.getElementById('ov-cta');
    if(cta) cta.href = 'send.html?amount=' + amount;
  }
};

// Waitlist form submit
var form = document.querySelector('form[name="waitlist"]');
if(form) {
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = form.email.value;
    var btn = form.querySelector('button');
    fetch('/', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'form-name=waitlist&email=' + encodeURIComponent(email)
    }).then(function(){
      btn.style.background = 'rgba(201,162,39,0.5)';
      form.email.value = '';
      form.email.placeholder = '✓ You\'re on the list!';
    }).catch(function(){
      window.location.href = '/thankyou.html';
    });
  });
}
</script>
