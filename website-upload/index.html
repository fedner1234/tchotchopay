.ham { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; margin-left: auto; border: none; background: none; }
.ham span { display: block; width: 24px; height: 2px; background: #0A1E5E; border-radius: 2px; }

/* ── MOBILE MENU ── */

<script>
var RATE = 127.89;
var currentAmt = 100;

function setAmt(n) {
  currentAmt = n;
  document.querySelectorAll('.hw-preset').forEach(function(b) {
    b.classList.toggle('active', parseInt(b.textContent.replace('$','')) === n);
  });
  updateCalc();
}

function updateCalc() {
  var fee = currentAmt * 0.02;
  var net = currentAmt - fee;
  var htg = Math.round(net * RATE);
  var sendEl = document.getElementById('hw-send');
  var feeEl = document.getElementById('hw-fee');
  var resEl = document.getElementById('hw-result');
  if (sendEl) sendEl.textContent = '$' + currentAmt.toFixed(2);
  if (feeEl) feeEl.textContent = '$' + fee.toFixed(2);
  if (resEl) resEl.textContent = htg.toLocaleString();
}

fetch('/api/exchange-rates').then(function(r){ return r.json(); }).then(function(d){
  if (d && d.HTG) { RATE = d.HTG; updateCalc(); }
}).catch(function(){});

updateCalc();

function joinWaitlist(e) {
  e.preventDefault();
  var form = e.target;
  var email = form.email.value;
  var btn = form.querySelector('.wl-submit');
  btn.textContent = 'Joining…';
  btn.disabled = true;
  fetch('/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'form-name=waitlist&email=' + encodeURIComponent(email)
  }).then(function() {
    btn.textContent = '✓ You\'re on the list!';
    form.email.value = '';
  }).catch(function() {
    btn.textContent = '✓ You\'re on the list!';
    form.email.value = '';
  });
}
</script>
