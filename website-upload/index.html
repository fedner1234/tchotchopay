*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#07163F;overflow-x:hidden}

/* Each designer section stacks as a full-width image */
.sec{position:relative;line-height:0;width:100%}
.sec img{
  width:100%;height:auto;display:block;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}

/* Invisible clickable overlays */
.sec a{
  position:absolute;display:block;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}

/* ── Live Calculator Card ── */
#tcalc{
  position:absolute;
  left:54%;top:18.5%;width:35.5%;height:68%;
  background:#fff;
  border:1.5px solid rgba(201,162,39,0.35);
  border-radius:clamp(6px,0.9vw,14px);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 4px 28px rgba(7,22,63,0.10);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
#tcalc .ch{
  padding:5% 7%;
  border-bottom:1px solid #F0E8D0;
  display:flex;align-items:flex-start;gap:6px;
  flex-shrink:0;
}
#tcalc .ch .arr{color:#C9A227;font-size:clamp(10px,1.3vw,18px);margin-top:1px}
#tcalc .ch .ht{font-size:clamp(9px,1vw,15px);font-weight:600;color:#0A1739;line-height:1.3}
/* Preset row */
#tcalc .pr{
  padding:4% 5%;
  display:flex;gap:3%;
  border-bottom:1px solid #F0E8D0;
  flex-shrink:0;
}
#tcalc .pr button{
  flex:1;
  padding:12% 0;
  border:1.5px solid #E0D5B0;
  border-radius:clamp(4px,0.5vw,8px);
  background:#fff;
  color:#0A1739;
  font-size:clamp(8px,0.9vw,13px);
  font-weight:600;
  cursor:pointer;
  transition:background 0.15s,color 0.15s;
}
#tcalc .pr button.sel{
  background:#07163F;color:#fff;border-color:#07163F;
}
/* Custom input row */
#tcalc .ci{
  padding:3% 5%;
  border-bottom:1px solid #F0E8D0;
  flex-shrink:0;
  display:flex;align-items:center;gap:5%;
}
#tcalc .ci label{font-size:clamp(7px,0.75vw,11px);color:#888;white-space:nowrap}
#tcalc .ci input{
  flex:1;
  border:1.5px solid #E0D5B0;
  border-radius:clamp(4px,0.5vw,7px);
  padding:8% 8%;
  font-size:clamp(9px,0.9vw,14px);
  font-weight:600;color:#0A1739;
  background:#FAFAF8;outline:none;
  width:100%;
}
#tcalc .ci input:focus{border-color:#C9A227}
/* Rows */
#tcalc .rows{
  flex:1;padding:3% 7%;
  display:flex;flex-direction:column;justify-content:space-between;
  min-height:0;overflow:hidden;
}
#tcalc .row{display:flex;justify-content:space-between;align-items:center}
#tcalc .row .lbl{display:flex;align-items:center;gap:5px}
#tcalc .row .lbl .fl{font-size:clamp(10px,1.1vw,16px);line-height:1}
#tcalc .row .lbl .lt{font-size:clamp(7px,0.78vw,11px);color:#777;line-height:1.3}
#tcalc .row .val{font-size:clamp(9px,0.9vw,14px);font-weight:600;color:#0A1739;text-align:right}
/* Recipient gets — big */
#tcalc .row.big .val{
  font-size:clamp(13px,1.7vw,26px);
  font-weight:800;color:#0A1739;
}
/* Info box */
#tcalc .ib{
  margin:0 7%;
  background:#EEF3FD;
  border-radius:clamp(4px,0.5vw,7px);
  padding:3% 4%;
  font-size:clamp(7px,0.72vw,10px);
  color:#1A3399;line-height:1.4;
  flex-shrink:0;
}
/* CTA button */
#tcalc .cta{
  margin:3% 7% 5%;
  display:block;
  background:#1A3399;
  color:#fff;
  text-align:center;
  padding:5% 0;
  border-radius:clamp(5px,0.6vw,9px);
  text-decoration:none;
  font-size:clamp(9px,1vw,15px);
  font-weight:600;
  flex-shrink:0;
  cursor:pointer;
}
#tcalc .cta:hover{background:#0D2278}

/* Waitlist form overlay */
.wl-form{
  position:absolute;
  display:flex;flex-direction:column;
  background:transparent;
  border:none;
}
.wl-email{
  width:100%;height:50%;
  background:transparent;border:none;outline:none;
  font-size:clamp(12px,1.5vw,18px);
  padding:0 16px;
  color:#0A1739;
}
.wl-btn{
  width:100%;height:50%;
  background:transparent;border:none;cursor:pointer;
}

<script>
// ── Live Calculator ──────────────────────────────────────
var tcp = (function(){
  var RATE = 129.35;   // effective HTG per USD (after TchotchoPay spread)
  var FEE  = 0.02;     // 2% send fee
  // Western Union effective rate for comparison (after their ~6% fees)
  var WU_RATE = 121.0;

  function fmt(n){ return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
  function fmtUSD(n){ return '$'+n.toFixed(2); }

  function calc(amount){
    amount = parseFloat(amount) || 0;
    var fee = amount * FEE;
    var net = amount - fee;
    var htg = Math.round(net * RATE);
    var wu  = Math.round(amount * WU_RATE);
    var diff= htg - wu;

    document.getElementById('c-send').textContent = fmtUSD(amount);
    document.getElementById('c-fee').textContent  = fmtUSD(fee);
    document.getElementById('c-htg').textContent  = fmt(htg) + ' HTG';
    document.getElementById('c-info').textContent =
      'Send '+fmtUSD(amount)+' via TchotchoPay and your family gets '+
      fmt(diff > 0 ? diff : 0)+' HTG more than Western Union.';
  }

  function clearSel(){
    ['p50','p100','p200','p500'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.classList.remove('sel');
    });
  }

  return {
    set: function(amount){
      clearSel();
      var el = document.getElementById('p'+amount);
      if(el) el.classList.add('sel');
      var ci = document.getElementById('custom-amt');
      if(ci) ci.value = '';
      calc(amount);
    },
    custom: function(val){
      clearSel();
      calc(val);
    }
  };
})();

// Waitlist form submit
var form = document.querySelector('form[name="waitlist"]');
if(form) {
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = form.email.value;
    var btn = form.querySelector('button');
    fetch('/', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'form-name=waitlist&email=' + encodeURIComponent(email)
    }).then(function(){
      btn.style.background = 'rgba(201,162,39,0.5)';
      form.email.value = '';
      form.email.placeholder = '✓ You\'re on the list!';
    }).catch(function(){
      window.location.href = '/thankyou.html';
    });
  });
}
</script>
