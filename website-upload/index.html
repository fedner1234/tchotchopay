<script>
// Handle waitlist form
document.querySelector('form[name="waitlist"]').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = this.email.value;
  var btn = this.querySelector('button');
  btn.style.background = 'rgba(201,162,39,0.3)';
  fetch('/', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'form-name=waitlist&email=' + encodeURIComponent(email)
  }).finally(function() {
    btn.textContent = '✓';
    btn.style.cursor = 'default';
  });
});
</script>
