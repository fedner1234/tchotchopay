<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px; height: 1920px;
  background: #020B2D;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  overflow: hidden;
  display: flex; flex-direction: column; align-items: center;
  position: relative;
}
.glow {
  position: absolute;
  width: 900px; height: 900px;
  background: radial-gradient(circle, rgba(0,174,239,0.22) 0%, transparent 70%);
  top: 380px; left: 50%; transform: translateX(-50%);
}
.logo-area { margin-top: 110px; text-align: center; }
.logo-text { font-size: 72px; font-weight: 700; color: #fff; letter-spacing: -1px; }
.logo-line { width: 280px; height: 2px; background: linear-gradient(90deg, transparent, #00AEEF, transparent); margin: 12px auto; }
.tag { font-size: 28px; font-weight: 400; color: #00AEEF; letter-spacing: 4px; text-transform: uppercase; }
.headline { margin-top: 100px; text-align: center; font-size: 76px; font-weight: 700; color: #fff; line-height: 1.15; }
.cyan { color: #00AEEF; }
.wallet-card {
  margin-top: 80px;
  width: 940px;
  background: linear-gradient(135deg, #0A1F6E 0%, #050E38 100%);
  border: 2px solid rgba(0,174,239,0.35);
  border-radius: 44px;
  padding: 60px;
}
.wallet-label { font-size: 26px; color: #00AEEF; letter-spacing: 4px; font-weight: 400; text-transform: uppercase; }
.wallet-sub { font-size: 34px; color: #8899BB; font-weight: 400; margin-top: 16px; }
.wallet-amount { font-size: 148px; font-weight: 700; color: #fff; line-height: 1; margin-top: 20px; }
.wallet-usdc { font-size: 52px; color: #00AEEF; font-weight: 400; margin-top: 8px; }
.pills { display: flex; gap: 20px; margin-top: 48px; }
.pill {
  padding: 16px 36px; border-radius: 50px;
  font-size: 30px; font-weight: 400;
  border: 1.5px solid;
}
.pill-g { color: #00C896; border-color: rgba(0,200,150,0.4); background: rgba(0,200,150,0.08); }
.pill-c { color: #00AEEF; border-color: rgba(0,174,239,0.4); background: rgba(0,174,239,0.08); }
.pill-w { color: #fff; border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); }
.equal { margin-top: 80px; text-align: center; font-size: 58px; font-weight: 700; color: #fff; }
.equal span { color: #00C896; }
.sub { margin-top: 30px; text-align: center; font-size: 40px; color: rgba(200,215,240,0.7); font-weight: 400; }
.url { position: absolute; bottom: 72px; font-size: 30px; color: rgba(136,153,187,0.5); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="logo-area">
  <div class="logo-text">TchotchoPay</div>
  <div class="logo-line"></div>
  <div class="tag">Kont USDC</div>
</div>
<div class="headline">Kenbe <span class="cyan">dola ou</span>.<br>Pa goud ki devalye.</div>
<div class="wallet-card">
  <div class="wallet-label">TchotchoPay Wallet</div>
  <div class="wallet-sub">Balans USDC ou</div>
  <div class="wallet-amount">$500</div>
  <div class="wallet-usdc">500.00 USDC</div>
  <div class="pills">
    <div class="pill pill-g">Estab</div>
    <div class="pill pill-c">Base</div>
    <div class="pill pill-w">24/7</div>
  </div>
</div>
<div class="equal">$1 USDC = <span>$1.00</span> toujou</div>
<div class="sub">HTG pedi -43% an 2023.<br>USDC pa chanje.</div>
<div class="url">tchotchopay.com/wallet</div>
</body>
</html>
